<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yıldız Futbolcu">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23fff' stroke='%23222' stroke-width='3'/%3E%3Cpath d='M32 20l11 8-4 13H25l-4-13z' fill='%23222'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yıldız Futbolcu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: tek sütunlu telefon oyunu; gece ışıklandırmalı stadyum, çim yeşili butonlar, altın OVR rozeti */
:root{
  --bg:#0c1712; --bg2:#13231b; --panel:#182c22; --panel2:#1f3a2c; --line:#2c4a3a;
  --fg:#eef5ef; --muted:#9bb5a6; --turf:#2f9a4c; --turf2:#3fb85e; --turfDark:#1f6e35;
  --gold:#f2c14e; --red:#e5534b; --blue:#4aa3df; --amber:#f0a03c;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% -10%,#1d3a2a 0%,var(--bg) 60%)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:40px;font-weight:800;line-height:1}
h2{font-size:26px;font-weight:700}
h3{font-size:19px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--turf2),var(--turf));border-radius:12px;padding:12px 16px;
  box-shadow:0 3px 0 var(--turfDark);color:#fff;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--turfDark)}
.btn.ghost{background:var(--panel2);box-shadow:0 3px 0 #0a140f}
.btn.gold{background:linear-gradient(180deg,#f7d06e,var(--gold));color:#2a1f05;box-shadow:0 3px 0 #a37c1c}
.btn.red{background:linear-gradient(180deg,#ef6a62,var(--red));box-shadow:0 3px 0 #8f2a24}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{font-size:16px;padding:8px 12px;border-radius:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input[type=text],select{background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;width:100%}
input[type=range]{width:100%;accent-color:var(--turf2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px}
.chip.on{background:var(--turf);border-color:var(--turf2)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.tag.gold{background:rgba(242,193,78,.16);color:var(--gold)}
.tag.green{background:rgba(63,184,94,.18);color:var(--turf2)}
.tag.red{background:rgba(229,83,75,.18);color:var(--red)}

/* title */
.title-hero{padding-block:36px 10px;text-align:center}
.title-hero .kicker{font-family:var(--display);color:var(--gold);letter-spacing:.3em;font-size:14px;font-weight:700}
.title-hero h1{font-size:54px;line-height:.92;margin-top:6px}
.title-hero h1 span{color:var(--turf2)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,#0f1f17,#0f1f17ee);
  border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0f1f17}
.tb1{display:flex;align-items:center;gap:8px}
.homeb{width:44px;height:44px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;border:2px solid var(--line);flex:none}
.homeb svg{width:22px;height:22px}
.money{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;min-width:0}
.money .buy{background:var(--turf);border-radius:999px;font-size:11px;font-weight:800;padding:5px 8px;letter-spacing:.04em}
.money b{font-family:var(--display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;flex:none}
.pts b{font-family:var(--display);font-size:18px;color:var(--gold)}
.ovr{width:56px;height:62px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#f7d06e,#c99a2e);color:#2a1f05;clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%)}
.ovr b{font-family:var(--display);font-size:30px;line-height:.9;font-weight:800}
.ovr span{font-size:10px;font-weight:800;letter-spacing:.1em}
.ovr .op{width:34px;height:4px;border-radius:2px;background:rgba(42,31,5,.25);margin-top:3px;overflow:hidden}
.ovr .op i{display:block;height:100%;background:#2a1f05}
.tb2{display:flex;align-items:center;gap:10px;margin-top:8px}
.namebar{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase}
.namebar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.energy{display:flex;align-items:center;gap:8px;margin-top:6px}
.ebar{flex:1;height:14px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.ebar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber) 40%,var(--turf2) 75%)}
.club{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}

/* tabs and main */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border-radius:12px;padding:4px}
.tabs button{padding:9px 4px;border-radius:9px;font-family:var(--display);font-size:17px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--fg)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 8px 8px}
.bar small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.bar .t{height:8px;border-radius:4px;background:#0a140f;margin-top:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(160deg,var(--turf2),var(--turf) 70%);border-radius:14px;padding:12px;text-align:left;min-height:104px;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 0 var(--turfDark);position:relative;overflow:hidden}
.tile h3{font-size:24px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tile small{font-size:11px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.tile p{margin:0;font-family:var(--display);font-size:18px;font-weight:700;line-height:1.05}
.tile svg{position:absolute;right:-6px;top:-4px;width:64px;height:64px;opacity:.22}
.navbar{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;gap:8px;align-items:end;
  background:linear-gradient(0deg,#0c1712,#0c1712ee);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.nb{background:linear-gradient(160deg,var(--turf2),var(--turf));border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:var(--display);font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--turfDark)}
.nb svg{width:28px;height:28px}
.play{height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8dfda 45%,#9aa59e);border:4px solid var(--turf2);display:grid;place-items:center;box-shadow:0 4px 0 var(--turfDark)}
.play svg{width:40px;height:40px}
.play.disabled{filter:grayscale(1);opacity:.7}
.banner{border-radius:12px;padding:10px 12px;background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.4);color:var(--gold);font-weight:600;font-size:14px}
.banner.red{background:rgba(229,83,75,.12);border-color:rgba(229,83,75,.45);color:#ff8f88}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.li .grow b{display:block}

/* nitelik */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px 10px}
.grp h3{font-size:18px;padding:6px 0 4px;color:var(--gold);display:flex;justify-content:space-between}
.attr{display:grid;grid-template-columns:1fr 64px 34px;gap:10px;align-items:center;width:100%;padding:7px 0;border-bottom:1px solid #22392d;text-align:left}
.attr:last-child{border-bottom:0}
.attr .n{font-weight:600;font-size:15px;display:flex;gap:6px;align-items:center;min-width:0}
.attr .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attr .key{color:var(--gold);font-size:12px}
.attr .t{height:6px;border-radius:3px;background:#0a140f;overflow:hidden}
.attr .t i{display:block;height:100%}
.attr .v{font-family:var(--display);font-weight:700;font-size:20px;text-align:right}
.stars{color:var(--gold);letter-spacing:1px}
.stars s{color:#3b5245;text-decoration:none}

/* sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(3,8,5,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:88vh;overflow:auto}
.scrim.center{align-items:center;padding:16px}
.scrim.center .sheet{border-radius:18px;border:1px solid var(--line)}
.bignum{font-family:var(--display);font-size:64px;font-weight:800;line-height:.9}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0a140f;border:1px solid var(--line);color:var(--fg);
  padding:10px 14px;border-radius:12px;z-index:60;font-weight:600;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* start cards */
.start{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.start .age{font-family:var(--display);font-size:30px;font-weight:800;text-align:center;line-height:.9}
.start .age small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.start .r{font-family:var(--display);font-size:26px;font-weight:800;color:var(--gold)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;font-size:11px;letter-spacing:.05em}
.tbl td{padding:6px 4px;text-align:right;border-top:1px solid #22392d}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl tr.me td{background:rgba(242,193,78,.12);color:var(--gold);font-weight:700}
.tbl tr.up td:first-child{box-shadow:inset 3px 0 0 var(--turf2)}
.tbl tr.down td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tbl tr.ucl td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.tbl tr.uel td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.tblwrap{overflow-x:auto}

/* match (NSS tarzı) */
.match{display:flex;flex-direction:column;height:100dvh;background:linear-gradient(180deg,#3b4146,#1f2428 38%,#2b3034)}
.mtop{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.mtop .heart{width:30px;height:30px;flex:none}
.mtop .ebar{height:20px;border-radius:10px;border:2px solid #0d1a12;background:#1a1f22}
.mtop .ebar i{background:linear-gradient(180deg,#6be276,#2f9a4c)}
.mtop .en{font-family:var(--display);font-weight:800;font-size:16px;width:30px;text-align:right}
.ff{width:50px;height:50px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7be276,#2f9a4c);border:3px solid #d5dbd8;
  font-family:var(--display);font-size:26px;font-weight:800;color:#d93a32;box-shadow:0 3px 0 #1f6e35;letter-spacing:-3px;padding-right:3px}
.ff.on{background:radial-gradient(circle at 35% 30%,#f7d06e,#c99a2e);color:#3a2604}
.sbar{display:grid;grid-template-columns:1fr 52px 1fr;padding-block:4px 8px}
.sbar>div{display:flex;align-items:center;gap:6px;padding:7px 10px;font-family:var(--display);font-weight:800;text-transform:uppercase;min-width:0;border:2px solid rgba(0,0,0,.4)}
.sbar .sl{border-radius:10px 0 0 10px;justify-content:space-between;background:var(--k);color:var(--kt)}
.sbar .sr{border-radius:0 10px 10px 0;justify-content:space-between;background:var(--k);color:var(--kt)}
.sbar b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbar .s2{font-size:26px;line-height:1}
.sbar .smin{background:linear-gradient(180deg,#f4f4f4,#babfc3);color:#333;justify-content:center;font-size:18px;padding:0;border-left:0;border-right:0}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column}
.feedv{flex:1;min-height:0;display:flex;flex-direction:column}
.feed2{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:8px;background:#151a1d;
  margin-left:max(10px,env(safe-area-inset-left,0px));margin-right:max(10px,env(safe-area-inset-right,0px));border-radius:12px;border:2px solid #4a5056}
.crow{display:grid;grid-template-columns:38px 1fr;align-items:center;min-height:40px;border-radius:8px;background:var(--k);
  background:linear-gradient(180deg,color-mix(in srgb,var(--k) 80%,#fff 20%),var(--k) 60%);border:2px solid rgba(0,0,0,.35);color:var(--kt);
  text-align:center;font-weight:600;font-size:14px;padding:3px 10px 3px 3px;flex:none}
.crow.gold{box-shadow:0 0 0 2px #f2c14e;font-weight:800}
.crow .ctx{padding-right:28px}
.cmin{width:32px;height:32px;border-radius:50%;background:#eceff1;color:#222;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;border:2px solid #555}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:10px 4px}
.mb{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#63d46c,#2f9a4c);border-radius:14px;padding:7px 10px;
  font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 3px 0 #1f6e35;font-style:italic;text-align:left;line-height:1}
.mb small{display:block;font-size:12px;font-style:normal;opacity:.85}
.mb .ic{width:34px;height:34px;flex:none;border-radius:50%;background:#2a2f33;border:2px solid #d5dbd8;display:grid;place-items:center;font-style:normal}
.mb .ic svg{width:18px;height:18px}
.mb.used{filter:grayscale(.85);opacity:.6}
.pitchv{display:flex;justify-content:center}
canvas#pitch{touch-action:none;display:block}
.pitchv{position:fixed;inset:0;z-index:30;background:#0c1712;align-items:flex-start}
.bars3{display:inline-flex;align-items:flex-end;gap:3px;height:22px}
.bars3 i{display:block;width:6px;border-radius:2px;background:rgba(0,0,0,.3)}
.bars3 i:nth-child(1){height:8px}.bars3 i:nth-child(2){height:14px}.bars3 i:nth-child(3){height:21px}
.bars3 i.on{background:#fff}
.bars3.sm{height:18px;gap:2px}.bars3.sm i{width:5px}.bars3.sm i:nth-child(1){height:6px}.bars3.sm i:nth-child(2){height:11px}.bars3.sm i:nth-child(3){height:17px}
.bars3.sm i{background:#3d4a44}.bars3.sm i.on{background:#5fe06a}
.phint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92%,420px);text-align:center;font-size:13px;font-weight:600;
  background:rgba(0,0,0,.6);border-radius:10px;padding:6px 10px;pointer-events:none}
.phint:empty{display:none}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:6px calc(8px + env(safe-area-inset-bottom,0px));font-size:13px;color:#b9c2bd}
.mfoot b{color:#fff;font-family:var(--display);font-size:18px}
.msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:46px;text-transform:uppercase;
  text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.5);pointer-events:none;text-align:center;line-height:.95;white-space:nowrap}
/* sözleşme pazarlığı */
.negx{display:flex;flex-direction:column;gap:12px}
.paper{background:linear-gradient(170deg,#fbf8f0,#efe8d6);color:#2b2a26;border-radius:10px;padding:14px 16px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);position:relative;transform:rotate(-1deg)}
.paper h3{font-family:Georgia,"Times New Roman",serif;font-size:26px;letter-spacing:.04em;color:#6b6556;font-weight:700;margin:0 0 2px}
.paper .dt{position:absolute;right:14px;top:14px;font-size:12px;color:#8a8370;font-family:Georgia,serif}
.paper .to{font-family:Georgia,serif;font-size:14px;margin:4px 0 8px}
.paper dl{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;margin:0;align-items:center;font-size:14px}
.paper dt{font-family:Georgia,serif}
.paper dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.paper .dl{color:#1f7a3a;font-weight:800;font-size:13px;min-width:56px;text-align:right}
.paper .stamp{position:absolute;right:16px;bottom:10px;transform:rotate(-12deg);border:3px solid #b3122e;color:#b3122e;font-weight:900;padding:2px 8px;border-radius:6px;font-family:var(--display);font-size:18px;opacity:.85}
.hlq{background:#1b2a22;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;font-family:var(--display);font-weight:700;font-size:19px;font-style:italic}

function buildTeams(){
  const teams={}; let id=0;
  LEAGUES.forEach(L=>{

        if(Array.isArray(t)){name=t[0];str=t[1]}

  });

function roundRobin(ids){
  const a=ids.slice(); if(a.length%2) a.push(null);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){const h=a[i],w=a[n-1-i]; if(h&&w) m.push(r%2?[w,h]:[h,w])}
    rounds.push(m); a.splice(1,0,a.pop());
  }
  const second=rounds.map(r=>r.map(([h,w])=>[w,h]));
  return rounds.concat(second);
}

const OVR_W={
 FW:{bitiricilik:18,atakPoz:13,kafa:10,sutGucu:10,reaksiyon:8,dribbling:7,topKontrol:10,vole:2,uzaktanSut:3,hizlanma:4,sprint:5,guc:5,soguk:5},

 OOS:{kisaPas:16,gorus:14,topKontrol:15,dribbling:13,uzaktanSut:5,bitiricilik:7,atakPoz:9,reaksiyon:7,ceviklik:3,hizlanma:4,soguk:7},
 MOS:{kisaPas:17,uzunPas:13,gorus:13,topKontrol:14,dribbling:7,topKesme:5,defFark:5,reaksiyon:8,dayan:6,uzaktanSut:4,soguk:8},

 BEK:{sprint:7,hizlanma:5,dayan:8,reaksiyon:8,topKesme:12,topKontrol:8,defFark:8,mudahale:11,kayma:14,orta:9,kisaPas:7,kafa:3},

function calcOVRf(p){const W=OVR_W[p.pos];let s=0;for(const k in W)s+=p.a[k]*W[k];return s/100}
function calcOVR(p){return Math.round(calcOVRf(p))}
function ovrW(k){return OVR_W[S.p.pos][k]||0}
function isKey(k){return POS[S.p.pos].key.includes(k)}
function costOf(k,v){
  if(v>=99) return null;
  if(isKey(k)){ if(v<70)return 1; if(v<75)return 2; if(v<85)return 3; if(v<90)return 4; if(v<95)return 5; return 6 }
  if(v<85) return 1; if(v<92) return 2; return 3;
}
function genAttrs(pos,target,h,w){
  const P=POS[pos],a={};
  ATTR_KEYS.forEach(k=>a[k]=target-20+ri(-5,5));
  P.sec.forEach(k=>a[k]=target-4+ri(-3,3));
  P.key.forEach(k=>a[k]=target+3+ri(-2,2));
  const hd=(h-180)/10, bmiD=(w-(h-105))/5;
  a.kafa+=Math.round(4*hd); a.ziplama+=Math.round(3*hd); a.ceviklik-=Math.round(3*hd); a.denge-=Math.round(2*hd);
  a.guc+=Math.round(2.5*bmiD); a.hizlanma-=Math.round(1.5*bmiD); a.sprint-=Math.round(bmiD);
  ATTR_KEYS.forEach(k=>a[k]=clamp(a[k],25,95));
  const p={pos,a};
  for(let i=0;i<60;i++){const o=calcOVR(p);if(o===target)break;const d=o<target?1:-1;
    [...P.key,...P.sec].forEach(k=>a[k]=clamp(a[k]+d,25,97))}
  return a;
}
function salaryFor(team,ovr){
  const L=leagueOf(team.lg)||leagueOf('SL'); const base=L.sal||TIER_SAL[L.tier];
  const avg=L.avg||{1:72,2:65,3:58,4:53}[L.tier];
  let s=base*clamp(1+(ovr-avg)/12,.4,3.2)*(1+(team.str-avg)/30);
  if(L.cap) s=Math.min(s,L.cap); else if(L.tier===1) s=Math.min(s,9000);
  s*=1+MANAGERS[S.c.mgr].sal;
  return Math.round(s/50)*50;
}
function formAvg(){const h=S.p.form;if(!h.length)return 6.5;return h.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,h.length)}

/* ================== OFFERS ================== */
function makeOffers(count,opts={}){
  const ovr=calcOVR(S.p), reach=MANAGERS[S.c.mgr].reach;
  const cur=S.c.team, parent=S.c.loan?S.c.loan.parent:null;
  let pool=Object.values(S.teams).filter(t=>t.lg!=='EU'&&t.id!==cur&&t.id!==parent&&t.str<=ovr+1+reach*.9&&t.str>=ovr-9);
  pool.sort((a,b)=>b.str-a.str);
  pool=pool.slice(0,Math.max(8,Math.floor(pool.length*.5)));
  const out=[];
  for(let i=0;i<count&&pool.length;i++){
    const t=pool.splice(Math.floor(rnd()*Math.min(pool.length,8)),1)[0];
    out.push(decorate({team:t.id,type:'transfer',salary:salaryFor(t,ovr),years:ri(1,4),id:'o'+Math.floor(rnd()*1e9)}));
  }
  const young=S.p.age<=21, lowForm=formAvg()<6.4;
  if((opts.loanChance!=null?rnd()<opts.loanChance:rnd()<(young?.65:lowForm?.55:.35))){
    let lp=Object.values(S.teams).filter(t=>t.lg!=='EU'&&t.id!==cur&&t.id!==parent&&t.str<=ovr+2&&t.str>=ovr-7);
    if(lp.length){const t=pick(lp);out.push(decorate({team:t.id,type:'loan',salary:salaryFor(t,ovr),buy:rnd()<.25+(S.c.mgr>=4?.35:0),id:'o'+Math.floor(rnd()*1e9)}))}
  }
  return out;
}
function decorate(o){
  if(o.goalBonus!=null) return o; const sl=o.salary;
  o.goalBonus=Math.round(sl*.15/50)*50; o.assistBonus=Math.round(sl*.08/50)*50;
  o.signOn=o.type==='loan'?0:Math.round(sl*ri(2,4)/100)*100;
  if(o.type!=='loan'&&!o.years) o.years=ri(1,4);
  o.base={salary:o.salary,goalBonus:o.goalBonus,assistBonus:o.assistBonus,signOn:o.signOn};
  o.patience=3; o.agreed=false; if(!o.id) o.id='o'+Math.floor(rnd()*1e9);
  return o;
}
function defaultBonuses(){S.c.goalBonus=Math.round(S.c.salary*.15/50)*50;S.c.assistBonus=Math.round(S.c.salary*.08/50)*50}
function findOffer(id){return (S&&S.c&&S.c.offers||[]).find(x=>x.id===id)||(draft&&draft.offers||[]).find(x=>x.id===id)}
function openWindow(kind){

  const fresh=makeOffers(n);

}
function acceptOffer(o){
  const old=myTeam();
  const t=S.teams[o.team];
  if(o.type==='loan'){
    const parent=S.c.loan?S.c.loan.parent:S.c.team;
    S.c.loan={parent,buy:o.buy,parentSalary:S.c.loan?S.c.loan.parentSalary:S.c.salary,parentGB:S.c.loan?S.c.loan.parentGB:S.c.goalBonus,parentAB:S.c.loan?S.c.loan.parentAB:S.c.assistBonus};
    S.c.team=t.id; S.c.salary=o.salary;
  }else{
    S.c.loan=null; S.c.team=t.id; S.c.salary=o.salary; S.c.years=o.years;
  }
  S.c.goalBonus=o.goalBonus; S.c.assistBonus=o.assistBonus; S.c.lastNegOvr=calcOVR(S.p);
  if(o.signOn){S.p.money+=o.signOn;log(`İmza parası: ${fullMoney(o.signOn)}`)}

}

/* ================== SEASON SIM ================== */
function simGame(hId,aId,force){
  const h=S.teams[hId],a=S.teams[aId];
  const lh=clamp(1.35+(h.str-a.str)/11+.2,.25,3.6), la=clamp(1.2+(a.str-h.str)/11,.2,3.4);
  return force||[poisson(lh),poisson(la)];
}
function applyResult(comp,hId,aId,gh,ga){
  const T=comp.table,h=T[hId],a=T[aId];
  h.p++;a.p++;h.gf+=gh;h.ga+=ga;a.gf+=ga;a.ga+=gh;
  if(gh>ga){h.w++;h.pts+=3;a.l++}else if(gh<ga){a.w++;a.pts+=3;h.l++}else{h.d++;a.d++;h.pts++;a.pts++}
}
function playRound(comp,override){
  const r=comp.round; if(r>=comp.fix.length) return;
  comp.fix[r].forEach(([h,a])=>{
    let res; if(override&&(override.h===h&&override.a===a)) res=[override.gh,override.ga]; else res=simGame(h,a);
    applyResult(comp,h,a,res[0],res[1]);
    comp.res.push({r,h,a,gh:res[0],ga:res[1]});
  });
  comp.round++;
}
function syncOthers(){
  const mc=myComp(); const prog=mc.round/mc.fix.length;
  Object.values(S.comps).forEach(c=>{ if(c===mc) return; const target=Math.round(prog*c.fix.length); while(c.round<target) playRound(c) });
}
function sorted(comp){
  return Object.entries(comp.table).sort((x,y)=>y[1].pts-x[1].pts||(y[1].gf-y[1].ga)-(x[1].gf-x[1].ga)||y[1].gf-x[1].gf).map(e=>e[0]);
}
function zones(lg){ // [promoteCount, relegateCount]
  return {SL:[0,3],L1:[3,4],L2:[2,3],L3:[2,0]}[lg]||[0,0];
}

function euroParticipants(first){
  const ucl=[],uel=[];
  Object.entries(EURO_Q).forEach(([lg,[a,b]])=>{
    const order=first?Object.values(S.teams).filter(t=>t.lg===lg).sort((x,y)=>y.str-x.str).map(t=>t.id):sorted(S.comps[grpKey(lg,0)]);
    ucl.push(...order.slice(0,a)); uel.push(...order.slice(a,a+b));
  });
  EU_UCL_FILL.forEach(n=>{const t=teamByName(n);if(t)ucl.push(t.id)});
  EU_UEL_FILL.forEach(n=>{const t=teamByName(n);if(t)uel.push(t.id)});
  return {ucl,uel};
}
function mkEuro(ids){const table={};ids.forEach(i=>table[i]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  return {ids,table,fix:roundRobin(ids).slice(0,6),res:[],ko:[],koRes:[],reach:{},winner:null}}
function newEuro(parts){S.euro={step:0,season:S.c.season,UCL:mkEuro(parts.ucl),UEL:mkEuro(parts.uel)}}
function leagueProg(){const c=myComp();return c.round/c.fix.length}
function euroDue(){return S.euro&&S.euro.step<9&&leagueProg()>=EURO_STEPS[S.euro.step]}
function myEuroMatch(){
  if(!S.euro||S.euro.step>=9) return null; const st=S.euro.step,me=S.c.team;
  for(const k of ['UCL','UEL']){const C=S.euro[k];
    const list=st<6?C.fix[st]:C.ko;
    const m=(list||[]).find(([h,a])=>h===me||a===me);
    if(m) return {k,h:m[0],a:m[1]};
  }
  return null;
}
function koWinner(h,a,gh,ga,pens){
  if(gh!==ga) return [gh>ga?h:a,false];
  if(pens!=null) return [pens?h:a,true];
  const p=.5+(S.teams[h].str-S.teams[a].str)/40; return [rnd()<p?h:a,true];
}
function runEuroStep(override){
  const st=S.euro.step; let out=null;
  ['UCL','UEL'].forEach(k=>{const C=S.euro[k];
    if(st<6){
      C.fix[st].forEach(([h,a])=>{let r;if(override&&override.h===h&&override.a===a)r=[override.gh,override.ga];else r=simGame(h,a);
        applyResult(C,h,a,r[0],r[1]);C.res.push({r:st,h,a,gh:r[0],ga:r[1]})});
      if(st===5){const top=sorted(C).slice(0,8);top.forEach(id=>C.reach[id]='qf');C.ko=[[top[0],top[7]],[top[1],top[6]],[top[2],top[5]],[top[3],top[4]]]}
    } else {
      const winners=[];
      C.ko.forEach(([h,a])=>{let r,pens=null;const mine=override&&override.h===h&&override.a===a;
        if(mine){r=[override.gh,override.ga];pens=override.pens}else r=simGame(h,a);
        const [w,pen]=koWinner(h,a,r[0],r[1],pens);winners.push(w);C.koRes.push({r:st,h,a,gh:r[0],ga:r[1],w,pen});
        if(mine) out={w,pen};});
      const nx=st===6?'sf':st===7?'f':'w';winners.forEach(id=>C.reach[id]=nx);
      if(st<8) C.ko=[];for(let i=0;i<winners.length&&st<8;i+=2)C.ko.push([winners[i],winners[i+1]]);
      if(st===8){C.winner=winners[0];C.ko=[]}
    }
  });
  S.euro.step++;
  return out;
}
function autoEuro(){while(euroDue()&&!myEuroMatch()) runEuroStep()}
function euroReachText(k){const C=S.euro&&S.euro[k];if(!C||!C.ids.includes(S.c.team))return '';const r=C.reach[S.c.team];
  return r==='w'?'şampiyon oldu':r==='f'?'finale kaldı':r==='sf'?'yarı finale kaldı':r==='qf'?'çeyrek finale kaldı':'lig aşamasında elendi'}

function nextFixture(){
  if(euroDue()){const e=myEuroMatch();if(e)return {h:e.h,a:e.a,home:e.h===S.c.team,opp:e.h===S.c.team?e.a:e.h,euro:e.k,step:S.euro.step};}
  const c=myComp(); if(c.round>=c.fix.length) return null;
  const m=c.fix[c.round].find(([h,a])=>h===S.c.team||a===S.c.team);
  if(!m) return null; return {h:m[0],a:m[1],home:m[0]===S.c.team,opp:m[0]===S.c.team?m[1]:m[0]};
}

  return {demand,tol:Math.max(.03,.1+lev)}}

let hl=null;
const HL_RATE={salary:.05,goalBonus:.12,assistBonus:.12,signOn:.1};
function hlSeq(){const seq=[ri(1,11)];while(seq.length<6){let n;do{n=ri(1,11)}while(n===seq[seq.length-1]);seq.push(n)}return seq}
function startHL(o){
  const seq=hlSeq();

  if(o==='self'){mode='self';team=myTeam();base={salary:S.c.salary,goalBonus:S.c.goalBonus||0,assistBonus:S.c.assistBonus||0,signOn:0}}

function hlTerms(){const g=hl.wins*(hl.status==='won'?1.5:1),t={};Object.keys(HL_RATE).forEach(k=>{t[k]=Math.round(hl.base[k]*(1+HL_RATE[k]*g)/50)*50});return t}

function hlSheet(){return ()=>{const t=S.teams[hl.team],k=kitOf(t),terms=hlTerms(),d=new Date(),dt=`${d.getDate()}.${d.getMonth()+1}.${S.c.season||2026}`;

function hlGuess(dir){if(!hl||hl.status!=='play'||hl.idx>=5)return;

  else if(r==='passok'){d=.25;feedPush(null,s,'İyi pas... Ancak fırsat harcanmış oldu.')}

    const p=.27+(myTeam().str-55)/120+(S.p.a.gorus-60)/300+(mate&&mate.y<GOAL_Y+150?.2:0)+(mate&&mate.call?.08:0);
    if(rnd()<p){d=.8;M.assists++;M.my++;label='GOL! ASİST';col='#f2c14e';M.events.push(`${M.min}' Asist yaptın.`);
      feedPush(null,s,`GOL! Harika pas, takım arkadaşın topu ağlara gönderdi! ${scoreTxt()}`,true)}

}

function promoteRelegate(){
  const moved={};
  const ord=(lg,g)=>sorted(S.comps[grpKey(lg,g)]);
  const setL=(id,lg,g,dir)=>{S.teams[id].lg=lg;S.teams[id].grp=g;moved[id]=dir};
  const sl=ord('SL',0), l1=ord('L1',0);
  const slDown=sl.slice(-3), l1Up=l1.slice(0,3), l1Down=l1.slice(-4);
  const l2=[0,1].map(g=>ord('L2',g)), l3=[0,1,2].map(g=>ord('L3',g));
  const l2Up=l2.flatMap(o=>o.slice(0,2)), l2Down=l2.map(o=>o.slice(-3)), l3Up=l3.map(o=>o.slice(0,2));
  slDown.forEach(id=>setL(id,'L1',0,'down')); l1Up.forEach(id=>setL(id,'SL',0,'up'));
  l2Up.forEach(id=>setL(id,'L1',0,'up'));
  l1Down.forEach((id,i)=>setL(id,'L2',i%2,'down'));
  // L2 bottom 3 per group -> L3 (2 per L3 group)
  const downs=l2Down.flat(); downs.forEach((id,i)=>setL(id,'L3',i%3,'down'));
  // L3 top 2 per group -> L2 (3 per L2 group)
  l3Up.flat().forEach((id,i)=>setL(id,'L2',i%2,'up'));
  // small strength drift
  Object.values(S.teams).forEach(t=>{ if(moved[t.id]==='up')t.str+=2; else if(moved[t.id]==='down')t.str-=2; t.str=clamp(t.str+ri(-1,1),45,90) });
  return moved;
}

function drawFx(){

function spawnConfetti(){

  for(let i=0;i<90;i++)M.parts.push({x:rnd()*W,y:-10-rnd()*LH*.4,vx:(rnd()-.5)*60,vy:60+rnd()*120,r:rnd()*6,vr:(rnd()-.5)*10,c:cols[i%cols.length]});

function updFx(dt){
  if(M.flash>0)M.flash=Math.max(0,M.flash-dt*2.5);
  if(M.fade>0)M.fade=Math.max(0,M.fade-dt*4);
  if(M.note)M.note.life-=dt;
  if(M.parts){M.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.vx+=Math.sin(p.y*.05)*4*dt});M.parts=M.parts.filter(p=>p.y<LH+20)}
  const sc=M.scene;if(!sc)return;
  if(sc.net)sc.net.t+=dt;
  if(sc.phase==='done'&&sc.post&&sc.post.life>0){const b=sc.ball,p=sc.post;p.life-=dt;b.x+=p.vx*dt;b.y+=p.vy*dt;p.vx*=1-3*dt;p.vy*=1-3*dt;b.z=Math.max(0,(b.z||0)-40*dt);
    if(p.inNet){b.x=clamp(b.x,GL+7,GR-7);if(b.y<GOAL_Y-12){b.y=GOAL_Y-12;p.vy=0;p.vx*=.5}if(b.y>GOAL_Y-1)b.y=GOAL_Y-1;b.z=Math.max(0,(b.z||0)-80*dt)}}
  if(sc.phase==='done'&&sc.hold){sc.ball.x=sc.gk.x+2;sc.ball.y=sc.gk.y-6;sc.ball.z=4}
}
function draw(){
  const s=cv.width/W, sc=M.scene;
  if(sc.phase==='strike'||sc.phase==='tapped'){const k=LH/560,ox=(W-W*k)/2;ctx.setTransform(s*k,0,0,s*k,s*ox,0);drawStrike(sc)}
  else{ctx.setTransform(s,0,0,s,0,0);ctx.drawImage(STANDS,0,0,W,OFF+40*ZM);ctx.setTransform(s*ZM,0,0,s*ZM,s*(W/2-W/2*ZM),s*OFF);drawPitch(sc);ctx.setTransform(s,0,0,s,0,0);drawScore()}
  ctx.setTransform(s,0,0,s,0,0);drawBanner();drawFx();
}

  if(S.v===2){const k=.4;S.c.salary=Math.round(S.c.salary*k/50)*50;if(S.c.loan&&S.c.loan.parentSalary)S.c.loan.parentSalary=Math.round(S.c.loan.parentSalary*k/50)*50;S.c.offers.forEach(o=>o.salary=Math.round(o.salary*k/50)*50);S.v=3;save()}
  if(S.v===3){const o=calcOVR(S.p);if(!S.c.loan)S.c.salary=salaryFor(myTeam(),o);else{S.c.salary=salaryFor(myTeam(),o);S.c.loan.parentSalary=salaryFor(S.teams[S.c.loan.parent],o)}
    S.c.offers.forEach(x=>x.salary=salaryFor(S.teams[x.team],o));if(S.c.boots>0&&S.c.bootsLeft==null)S.c.bootsLeft=BOOT_LIFE;S.v=4;save()}
  if(S.v===4){const o=calcOVR(S.p);S.c.salary=salaryFor(myTeam(),o);if(S.c.loan)S.c.loan.parentSalary=salaryFor(S.teams[S.c.loan.parent],o);S.c.offers.forEach(x=>x.salary=salaryFor(S.teams[x.team],o));S.v=5;save()}
  if(S.v===5){const o=calcOVR(S.p);S.c.salary=salaryFor(myTeam(),o);if(S.c.loan)S.c.loan.parentSalary=salaryFor(S.teams[S.c.loan.parent],o);S.c.offers.forEach(x=>x.salary=salaryFor(S.teams[x.team],o));S.v=6;save()}
  if(S.v===6){const o=calcOVR(S.p);S.c.salary=salaryFor(myTeam(),o);if(S.c.loan)S.c.loan.parentSalary=salaryFor(S.teams[S.c.loan.parent],o);S.c.offers.forEach(x=>x.salary=salaryFor(S.teams[x.team],o));S.v=7;save()}
  if(S.v===7){
    let mx=Math.max(...Object.keys(S.teams).map(k=>+k.slice(1)))+1;const have=new Set(Object.values(S.teams).map(t=>t.name));
    LEAGUES.filter(L=>L.foreign).forEach(L=>L.groups.forEach((g,gi)=>g.forEach(([name,str])=>{if(!have.has(name)){S.teams['t'+mx]={id:'t'+mx,name,str,lg:L.id,grp:gi};mx++}})));
    EU_TEAMS.forEach(([name,str])=>{if(!have.has(name)){S.teams['t'+mx]={id:'t'+mx,name,str,lg:'EU',grp:0};mx++}});
    LEAGUES.filter(L=>L.foreign).forEach(L=>{const ids=teamsIn(L.id,0).map(t=>t.id),table={};ids.forEach(i=>table[i]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
      S.comps[grpKey(L.id,0)]={lg:L.id,grp:0,fix:roundRobin(ids),round:0,table,res:[]}});
    syncOthers(); newEuro(euroParticipants(true)); while(euroDue()) runEuroStep(); S.v=8; save()}
  if(S.v===9){}
  if(S.v===8){const o=calcOVR(S.p);S.c.salary=salaryFor(myTeam(),o);if(S.c.loan)S.c.loan.parentSalary=salaryFor(S.teams[S.c.loan.parent],o);S.c.offers.forEach(x=>x.salary=salaryFor(S.teams[x.team],o));S.v=9;save()}
  if(S.v===9){const o=calcOVR(S.p);S.c.salary=salaryFor(myTeam(),o);if(S.c.loan)S.c.loan.parentSalary=salaryFor(S.teams[S.c.loan.parent],o);S.c.offers.forEach(x=>x.salary=salaryFor(S.teams[x.team],o));S.v=10;save()}
  if(S.c.goalBonus==null) defaultBonuses();
  if(S.c.lastNegOvr==null) S.c.lastNegOvr=calcOVR(S.p);
  (S.c.offers||[]).forEach(decorate);
  if(S.p.money<0){S.p.money=0;if(S.c.mgr){log(`Paran yetmediği için ${MANAGERS[S.c.mgr].name} ile sözleşmen bitti.`);S.c.mgr=0}save()}
}

function startCareer(){
  const d=draft, st=STARTS[d.start];
  S={v:10,teams:buildTeams(),
    p:{name:d.name,surname:d.surname,country:d.country,h:d.h,w:d.w,pos:d.pos,foot:d.foot,age:st.age,
      a:genAttrs(d.pos,st.ovr,d.h,d.w),st:{beceri:st.ovr>=74?3:2,zayif:d.foot==='Çift'?5:st.ovr>=76?3:2},points:0,money:st.ovr*40,energy:100,happy:60,form:[]},
    c:{season:SEASON0,team:null,salary:0,years:2,loan:null,mgr:0,boots:0,drinks:2,house:0,car:0,sponsors:[],offers:[],window:null,news:[],injury:0,
      stat:{apps:0,goals:0,assists:0,rsum:0,motm:0},total:{apps:0,goals:0,assists:0,rsum:0,motm:0},history:[],weekLabel:'Başlangıç',diff:d.diff||'orta'}};
  newSeasonComps();
  const lg=d.lg||st.lg, foreign=leagueOf(lg).foreign;
  newEuro(euroParticipants(true));
  const lgTeams=Object.values(S.teams).filter(t=>t.lg===lg).sort((a,b)=>b.str-a.str);
  let cands;
  if(st.id===4){ d.parent=pick(lgTeams.slice(0,5)).id; cands=lgTeams.slice(-9).filter(t=>t.id!==d.parent) }
  else if(st.id===6) cands=lgTeams.slice(0,5);
  else if(st.id===5) cands=lgTeams.slice(0,7);
  else cands=lgTeams.slice(Math.floor(lgTeams.length*(foreign?.55:.15)));
  const ovr=st.ovr, offers=[];
  const pool=cands.slice();
  for(let i=0;i<3&&pool.length;i++){const t=pool.splice(Math.floor(rnd()*pool.length),1)[0];
    offers.push(decorate(st.loan||(i===2&&rnd()<.4)?{team:t.id,type:'loan',salary:salaryFor(t,ovr),buy:rnd()<.35}:{team:t.id,type:'transfer',salary:salaryFor(t,ovr),years:ri(2,4)}))}
  d.offers=offers;
  go('firstOffers');
}
